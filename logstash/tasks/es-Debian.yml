---
- name: Updating the apt package.
  apt:
    update_cache: yes

- name: Dependencies are installing.
  apt:
    name: "{{ Dependency }}"
    state: present

- name: Adding GPG key for logstash.
  apt_key:
      url: "{{ logstash_GPG_key }}"
      state: present
      validate_certs: yes
      keyring: "{{ key_ring }}"

- name: Adding repository for logstash.
  apt_repository:
      repo: "{{ repository }}"
      state: present
      
- name: Installing logstash.
  apt:
      update_cache: yes
      name: logstash
      state: present
  notify: Restart logstash          

